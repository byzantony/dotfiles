#
# Hyprland Configuration
# byzantony | Artix Linux | OpenRC

# Source Files
source = ~/.config/hypr/monitors.conf # DO NOT CHANGE OR EDIT
source = ~/.config/hypr/workspaces.conf

# HYPRLAND Branding
misc { 
   disable_hyprland_logo = true
   disable_splash_rendering = true
}


###################
### MY PROGRAMS ###
###################

$terminal     = kitty
$fileManager  = thunar
$menu         = ~/.config/rofi/launchers/type-4/launcher.sh || pkill rofi
$browser      = brave-browser --restore-last-session

# Brave Web Apps
$discord      = brave --app-id=dpailibpbgpnbhaiikoggbmkncmchnea --profile-directory=Default
$telegram     = brave --app-id=majiogicmcnmdhhlgmkahaleckhjbmlk --profile-directory=Default
$calendar     = brave --app-id=ojibjkjikcpjonjjngfkegflhmffeemk --profile-directory=Default
$email        = brave --app-id=jnpecgipniidlgicjocehkhajgdnjekh --profile-directory=Default

###################
### KEYBINDINGS ###
###################

$mainMod = SUPER

# ── Applications ────────────────────────────────
bindd = $mainMod, RETURN, Open terminal, exec, $terminal
bindd = $mainMod, SPACE, Open app launcher, exec, $menu
bindd = $mainMod, E, Open file manager, exec, $fileManager
bindd = $mainMod, W, Open wallpaper picker, exec, waypaper

# ── Window Management ────────────────────────────
bindd = $mainMod, C, Close active window, killactive,
bindd = $mainMod, V, Toggle floating, togglefloating,
bindd = $mainMod, P, Toggle pseudo tiling, pseudo,
bindd = $mainMod, J, Toggle split layout, layoutmsg, togglesplit

# Resize windows with arrow keys
binde = $mainMod SHIFT, right, resizeactive, 50 0
binde = $mainMod SHIFT, left, resizeactive, -50 0

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ── Session ─────────────────────────────────────
bindd = $mainMod SHIFT, Escape, Exit Hyprland, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
#bindd = $mainMod, ESC, Hibernate, exec, echo disk | sudo tee /sys/power-state
bindd = $mainMod, Escape, Open power menu, exec, ~/.config/rofi/powermenu/type-5/powermenu.sh

# ── Focus Movement ───────────────────────────────
bindd = $mainMod, h, Move focus left, movefocus, l
bindd = $mainMod, j, Move focus right, movefocus, r
bindd = $mainMod, k, Move focus up, movefocus, u
bindd = $mainMod, l, Move focus down, movefocus, d

# ── Workspaces ───────────────────────────────────
bindd = $mainMod, 1, Switch to workspace 1, workspace, 1
bindd = $mainMod, 2, Switch to workspace 2, workspace, 2
bindd = $mainMod, 3, Switch to workspace 3, workspace, 3
bindd = $mainMod, 4, Switch to workspace 4, workspace, 4
bindd = $mainMod, 5, Switch to workspace 5, workspace, 5
bindd = $mainMod, 6, Switch to workspace 6, workspace, 6
bindd = $mainMod, 7, Switch to workspace 7, workspace, 7
bindd = $mainMod, 8, Switch to workspace 8, workspace, 8
bindd = $mainMod, 9, Switch to workspace 9, workspace, 9
bindd = $mainMod, 0, Switch to workspace 10, workspace, 10

# ── Move Window to Workspace ─────────────────────
bindd = $mainMod SHIFT, 1, Move window to workspace 1, movetoworkspace, 1
bindd = $mainMod SHIFT, 2, Move window to workspace 2, movetoworkspace, 2
bindd = $mainMod SHIFT, 3, Move window to workspace 3, movetoworkspace, 3
bindd = $mainMod SHIFT, 4, Move window to workspace 4, movetoworkspace, 4
bindd = $mainMod SHIFT, 5, Move window to workspace 5, movetoworkspace, 5
bindd = $mainMod SHIFT, 6, Move window to workspace 6, movetoworkspace, 6
bindd = $mainMod SHIFT, 7, Move window to workspace 7, movetoworkspace, 7
bindd = $mainMod SHIFT, 8, Move window to workspace 8, movetoworkspace, 8
bindd = $mainMod SHIFT, 9, Move window to workspace 9, movetoworkspace, 9
bindd = $mainMod SHIFT, 0, Move window to workspace 10, movetoworkspace, 10

# ── Special Workspace (Scratchpad) ───────────────
bindd = $mainMod, S, Toggle scratchpad, togglespecialworkspace, magic
bindd = $mainMod SHIFT, S, Move window to scratchpad, movetoworkspace, special:magic

# ── Screenshots ──────────────────────────────────
bindd = $mainMod, O, Screenshot full screen, exec, ~/.config/hypr/scripts/screenshot.sh screen
bindd = $mainMod, I, Screenshot selected area, exec, ~/.config/hypr/scripts/screenshot.sh area
bindd = $mainMod, \, Screenshot active window, exec, ~/.config/hypr/scripts/screenshot.sh active

#  ── Clipboard ───────────────────────────────────
bind = $mainMod SHIFT, V, exec, kitty --class clipse -e clipse
#bind = $mainMod SHIFT, V, exec, cliphist list | ~/.config/rofi/launchers/type-4/launcher.sh -dmenu -p "  Clipboard History" | cliphist decode | wl-copy

# ── Workspace Scrolling ──────────────────────────
bindd = $mainMod, right, Scroll to next workspace, workspace, e+1
bindd = $mainMod, left, Scroll to previous workspace, workspace, e-1
bind = $mainMod, mouse_down, workspace, e+1 # Mouse scroll
bind = $mainMod, mouse_up, workspace, e-1   # Mouse scroll
bindd = $mainMod, Tab, Switch to previous workspace, workspace, previous

# ── Keybinding Help ──────────────────────────────
bindd = $mainMod SHIFT, H, Show keybindings, exec, ~/.config/hypr/scripts/keybinds.sh
bindd = $mainMod, Y, NvChad cheatsheet, exec, ~/.config/rofi/scripts/nvchad-cheatsheet.sh

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Misc
# Restart OBS Virtual Camera when it freezes
bind = $mainMod SHIFT, O, exec, ~/.config/hypr/scripts/restart-vcam.sh


#################
### AUTOSTART ###
#################

# === Core Services ===
exec-once = ~/.config/hypr/scripts/waybar.sh
exec-once = pipewire
exec-once = pipewire-pulse
exec-once = wireplumber
exec-once = xsettingsd
exec-once = clipse -listen

# === Writing / Text Editing ===
exec-once = emacs

# === Keyring (important for Brave, KeePassXC, etc.) ===
# GNOME Keyring - disable SSH component (let keychain handle Yubikey)
exec-once = gnome-keyring-daemon --start --components=secrets,pkcs11

# ── Keybinding Help ──────────────────────────────
exec-once = syncthing --no-browser

# === Tray / System apps ===
#exec-once = sleep 2 && trayscale --hide-window
#exec-once = sleep 2 && localsend --hide-window

# === Proton Services ===
exec-once = protonmail-bridge --noninteractive &

# === Clipboard History (cliphist) ===
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# === Mount network shares (delayed because of OpenRC) ===
exec-once = ~/.config/hypr/scripts/mount-network.sh
exec-once = sudo mount -a

# === Wallpapers ===
exec-once = swww-daemon
exec-once = sleep 2 && swww img /home/anthony/Pictures/4k-Wallpapers/Monochrome/mono-glitch.jpg
exec-once = sleep 2 && swww img /home/anthony/Pictures/4k-Wallpapers/Vertical/mono-clouds.jpg --outputs DVI-D-1 --transition-type none

# === Apps on specific workspaces ===
exec-once = [workspace 1 silent] $terminal
exec-once = [workspace 2 silent] Emacs
exec-once = [workspace 3 silent] org.gajim.Gajim
exec-once = [workspace 4 silent] $email
exec-once = [workspace 4 silent] $calendar
exec-once = [workspace 5 silent] org.keepassxc.KeePassXC --hide-window
exec-once = [workspace 6 silent] $discord
exec-once = [workspace 6 silent] $telegram


#############################
### ENVIRONMENT VARIABLES ###
#############################

# NVIDIA
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = LIBVA_DRIVER_NAME,nvidia
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = MOZ_ENABLE_WAYLAND,1
env = WLR_RENDERER_ALLOW_SOFTWARE,1

# XDG
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland

# QT
env = QT_QPA_PLATFORM,wayland

# GTK 
env = GTK2_RC_FILES,/usr/share/themes/Adwaita-dark/gtk-2.0/gtkrc
env = GTK_THEME,Adwaita-dark

# CURSORS
env = WLR_NO_HARDWARE_CURSORS,1
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = CURSOR_THEME,Adwaita-dark

#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 5
    gaps_out = 20

    border_size = 2

    ## Default blue/green border
    #col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    #col.inactive_border = rgba(595959aa)

    ## Monochrome theme
    col.active_border = rgba(888888ff)
    col.inactive_border = rgba(333333ff)
    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 6
    rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 1
    inactive_opacity = 1

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default curves, see https://wiki.hypr.land/Configuring/Animations/#curves
    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          2.15, 0,    0.1,  1

    # Default animations, see https://wiki.hypr.land/Configuring/Animations/
    #           NAME,          ONOFF, SPEED, CURVE,        [STYLE]
    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     4.79,  easeOutQuint
    animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
    animation = windowsOut,    1,     1.49,  linear,       popin 87%
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  1,     1.79,  almostLinear
    animation = fadeLayersOut, 1,     1.39,  almostLinear
    animation = workspaces,    1,     1.94,  almostLinear, fade
    animation = workspacesIn,  1,     1.21,  almostLinear, fade
    animation = workspacesOut, 1,     1.94,  almostLinear, fade
    animation = zoomFactor,    1,     7,     quick
}

##############################
### WINDOWS AND WORKSPACES ###
##############################


# Emacs
windowrule { 
    name = emacs
    match:class = Emacs
    workspace = 1
    opacity = 0.85 0.75
}


# Main Brave browser (normal tabs / restored session) → Workspace 2
windowrule {
    name = brave-main
    match:class = brave-browser
    workspace = 2
}

# Brave Web Apps - using their unique class
windowrule {
    name = brave-discord
    match:class = brave-dpailibpbgpnbhaiikoggbmkncmchnea-Default
    workspace = 6
}

windowrule {
    name = brave-telegram
    match:class = brave-majiogicmcnmdhhlgmkahaleckhjbmlk-Default
    workspace = 6
}

windowrule {
    name = brave-calendar
    match:class = brave-ojibjkjikcpjonjjngfkegflhmffeemk-Default
    workspace = 4
}

windowrule {
    name = brave-email
    match:class = brave-jnpecgipniidlgicjocehkhajgdnjekh-Default
    workspace = 4
}

# Gajim
windowrule {
    name = gajim-workspace
    match:class = org.gajim.Gajim
    workspace = 3
}

# KeePassXC
windowrule {
    name = keepass-workspace
    match:class = org.keepassxc.KeePassXC
    workspace = 5
}

# Floating rules
windowrule {
    name = empty-class-float
    match:class = ^$
    match:title = ^$
    float = yes
    pin = yes
    move = 1610 10
    size = 290 150
}

windowrule {
    name = thunar-float
    match:class = thunar
    float = yes
    size = 900 600
    center = yes
}

windowrule {
    name = waypaper-float
    match:class = waypaper
    float = yes
    size = 900 600
    center = yes
}

# Clipse (clipboard history)
windowrule {
    name = clipse-float
    match:class = clipse
    float = yes
    size = 700 600
    center = yes
}

# Suppress maximize requests from apps
windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}
# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/

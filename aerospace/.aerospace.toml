# ============================================================
# AeroSpace Tiling Window Manager Configuration
# Docs: https://nikitabobko.github.io/AeroSpace/commands
# ============================================================


# ────────────────────────────────────────────────────────────
# STARTUP
# ────────────────────────────────────────────────────────────

# Commands to run once after macOS login (before AeroSpace fully loads)
after-login-command = []

# Commands to run after AeroSpace itself has started
after-startup-command = ['exec-and-forget sketchybar', 'exec-and-forget borders']

# Start AeroSpace automatically when you log in to macOS
start-at-login = true


# ────────────────────────────────────────────────────────────
# SKETCHYBAR INTEGRATION
# Tell SketchyBar which workspace is focused so it can highlight it
# ────────────────────────────────────────────────────────────

exec-on-workspace-change = [
    '/bin/bash',
    '-c',
    'sketchybar --trigger aerospace_workspace_change FOCUSED=$AEROSPACE_FOCUSED_WORKSPACE',
]


# ────────────────────────────────────────────────────────────
# LAYOUT BEHAVIOR
# ────────────────────────────────────────────────────────────

# "Flatten" removes unnecessary nesting if you accidentally create it
enable-normalization-flatten-containers = true

# If you nest a container inside another, this auto-rotates its direction
# so tiles stack in a useful way
enable-normalization-opposite-orientation-for-nested-containers = true

# Space between stacked windows in "accordion" layout (set to 0 to disable)
accordion-padding = 30

# How windows are arranged by default: tiles = side-by-side
default-root-container-layout = 'tiles'

# 'auto' = wide monitors tile horizontally, tall monitors tile vertically
default-root-container-orientation = 'auto'


# ────────────────────────────────────────────────────────────
# MOUSE BEHAVIOR
# ────────────────────────────────────────────────────────────

# When you switch to a different monitor, the mouse jumps to its center
# Remove this line if you find that annoying
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Keep this false — if true, cmd-h would never hide apps
automatically-unhide-macos-hidden-apps = false


# ────────────────────────────────────────────────────────────
# KEY MAPPING PRESET
# ────────────────────────────────────────────────────────────

[key-mapping]
preset = 'qwerty'


# ────────────────────────────────────────────────────────────
# GAPS
# Space between windows (inner) and between windows and screen edge (outer)
# ────────────────────────────────────────────────────────────

[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.bottom = 8
outer.top = [
{ monitor."built-in" = 12 },
{ monitor."main" = 42 },
42
]
outer.right = 8


# ════════════════════════════════════════════════════════════
# KEYBINDINGS — MAIN MODE
# This is the mode you're always in by default
# ════════════════════════════════════════════════════════════

[mode.main.binding]

# ── App Launchers ─────────────────────────────────────────
# Note: option/alt + letter inserts a special character in most apps,
# but AeroSpace intercepts these before apps see them — so no conflict.

# alt-b = 'exec-and-forget open -a /Applications/Zen.app'
# alt-c = 'exec-and-forget open -a /Applications/Zed.app'
# alt-t = 'exec-and-forget open -a /Applications/Ghostty.app'
# alt-s = 'exec-and-forget open -a /Applications/Slack.app'
# alt-d = 'exec-and-forget open -a /Applications/Discord.app'
# alt-p = 'exec-and-forget open -a /Applications/Forklift.app'
# alt-o = 'exec-and-forget open -a /Applications/OBS.app/'
# alt-w = 'exec-and-forget open -a /Applications/Obsidian.app'
# alt-m = 'exec-and-forget open -a /System/Applications/Mail.app'
# alt-z = 'exec-and-forget open -a /Applications/Zotero.app'

# Reload SketchyBar (the status bar)
alt-shift-r = ['exec-and-forget /opt/homebrew/bin/sketchybar --reload']


# ── Layout Toggles ────────────────────────────────────────

# Toggle between tiling and accordion layouts
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

# Toggle fullscreen for the focused window
alt-f = 'fullscreen'

# Join focused window with the one below it, arranged side-by-side
# Useful for combining two windows into a horizontal pair
alt-y = ['focus right', 'join-with down', 'layout tiles horizontal']


# ── Focus (move keyboard focus between windows) ───────────
# Vim-style: h=left, j=down, k=up, l=right

alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'


# ── Move (relocate the focused window within its workspace) ─

alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'


# ── Resize the focused window ─────────────────────────────

alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'


# ── Workspace Switching ───────────────────────────────────

alt-1 = 'workspace 1-Browsing'
alt-2 = 'workspace 2-Media'
alt-3 = 'workspace 3-Chats'
alt-4 = 'workspace 4-Code'
alt-5 = 'workspace 5-Writing'
alt-6 = 'workspace 6-Mail'
alt-7 = 'workspace 7-Files'
alt-8 = 'workspace 8-Bib'
alt-9 = 'workspace 9-Share'
alt-0 = 'workspace 0-Misc'

# Jump back to whichever workspace you were on before
alt-tab = ['workspace-back-and-forth']

# Move the focused workspace to the next monitor (wraps around)
alt-shift-d = 'move-workspace-to-monitor --wrap-around next'


# ── Move Window to a Different Workspace ─────────────────
# Window moves but you stay on the current workspace

alt-shift-1 = 'move-node-to-workspace 1-Browsing'
alt-shift-2 = 'move-node-to-workspace 2-Media'
alt-shift-3 = 'move-node-to-workspace 3-Chats'
alt-shift-4 = 'move-node-to-workspace 4-Code'
alt-shift-5 = 'move-node-to-workspace 5-Writing'
alt-shift-6 = 'move-node-to-workspace 6-Mail'
alt-shift-7 = 'move-node-to-workspace 7-Files'
alt-shift-8 = 'move-node-to-workspace 8-Bib'
alt-shift-9 = 'move-node-to-workspace 9-Share'
alt-shift-0 = 'move-node-to-workspace 0-Misc'


# ── Enter Service Mode ────────────────────────────────────
# Service mode is for less-frequent commands (reset layout, float/tile, etc.)

alt-shift-semicolon = 'mode service'


# ════════════════════════════════════════════════════════════
# KEYBINDINGS — SERVICE MODE
# Press alt-shift-; to enter, then press the key shown below
# ════════════════════════════════════════════════════════════

[mode.service.binding]

# Exit service mode (also reloads config)
esc = ['reload-config', 'mode main']

# Reset the workspace layout if windows are in a weird state
r = ['flatten-workspace-tree', 'mode main']

# Toggle the focused window between floating and tiling
f = ['layout floating tiling', 'mode main']

# Close all windows on this workspace except the focused one
backspace = ['close-all-windows-but-current', 'mode main']

# Merge the focused window into an adjacent one (creates a container)
alt-shift-h = ['join-with left',  'mode main']
alt-shift-j = ['join-with down',  'mode main']
alt-shift-k = ['join-with up',    'mode main']
alt-shift-l = ['join-with right', 'mode main']

# Volume controls (handy since you're already pressing a modifier)
up         = 'volume up'
down       = 'volume down'
shift-down = ['volume set 0', 'mode main']


# ════════════════════════════════════════════════════════════
# WINDOW RULES
# Automatically route apps to their workspaces when they open
# ════════════════════════════════════════════════════════════


# ── Workspace 1 · Browsing ───────────────────────────────

[[on-window-detected]]
if.app-id = 'app.zen-browser.zen'
run = ['move-node-to-workspace 1-Browsing']

[[on-window-detected]]
if.app-id = 'com.vivaldi.Vivaldi'
run = ['move-node-to-workspace 1-Browsing']

[[on-window-detected]]
if.app-id = 'com.brave.Browser'
run = ['move-node-to-workspace 1-Browsing']


# ── Workspace 2 · Media ──────────────────────────────────

[[on-window-detected]]
if.app-id = 'com.obsproject.obs-studio'
run = ['move-node-to-workspace 2-Media']

[[on-window-detected]]
if.app-id = 'org.audacityteam.audacity'
run = ['move-node-to-workspace 2-Media']

[[on-window-detected]]
if.app-id = 'com.hindenburg.Hindenburg'
run = ['move-node-to-workspace 2-Media']

[[on-window-detected]]
if.app-id = 'com.apple.audio.AudioMIDISetup'
run = ['move-node-to-workspace 2-Media']

[[on-window-detected]]
if.app-id = 'com.colliderli.iina'
run = ['move-node-to-workspace 2-Media']

[[on-window-detected]]
if.app-id = 'org.cogx.cog'
run = ['move-node-to-workspace 2-Media']

[[on-window-detected]]
if.app-id = 'com.apple.FinalCut'
run = ['move-node-to-workspace 2-Media']

# Final Cut's Media Import window should float, not tile
[[on-window-detected]]
if.app-id = 'com.apple.FinalCut'
if.window-title-regex-substring = 'Media Import'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'org.nicotine_plus.Nicotine'
run = ['move-node-to-workspace 2-Media']


# ── Workspace 3 · Chats ──────────────────────────────────

[[on-window-detected]]
if.app-id = 'com.hnc.Discord'
run = ['move-node-to-workspace 3-Chats']

[[on-window-detected]]
if.app-id = 'com.tdesktop.Telegram'
run = ['move-node-to-workspace 3-Chats']


# ── Workspace 4 · Code ───────────────────────────────────

[[on-window-detected]]
if.app-id = 'dev.zed.Zed'
run = ['move-node-to-workspace 4-Code']

[[on-window-detected]]
if.app-id = 'com.github.wez.wezterm'
run = ['move-node-to-workspace 4-Code']

[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = ['move-node-to-workspace 4-Code']


# ── Workspace 5 · Writing ────────────────────────────────

[[on-window-detected]]
if.app-id = 'com.hemingwayapp.editor3'
run = ['move-node-to-workspace 5-Writing']

[[on-window-detected]]
if.app-id = 'md.obsidian'
run = ['move-node-to-workspace 5-Writing']

[[on-window-detected]]
if.app-id = 'com.literatureandlatte.scrivener3'
run = ['move-node-to-workspace 5-Writing']

[[on-window-detected]]
if.app-id = 'com.apple.iWork.Pages'
run = ['move-node-to-workspace 5-Writing']

[[on-window-detected]]
if.app-id = 'com.ulyssesapp.mac'
run = ['move-node-to-workspace 5-Writing']

[[on-window-detected]]
if.app-id = 'pro.writer.mac'
run = ['move-node-to-workspace 5-Writing']


# ── Workspace 6 · Mail ───────────────────────────────────

[[on-window-detected]]
if.app-id = 'com.apple.mail'
run = 'move-node-to-workspace 6-Mail'

[[on-window-detected]]
if.app-id = 'com.protonmail.bridge'
run = 'move-node-to-workspace 6-Mail'


# ── Workspace 7 · Files ──────────────────────────────────

[[on-window-detected]]
if.app-id = 'com.binarynights.ForkLift'
run = ['move-node-to-workspace 7-Files']

[[on-window-detected]]
if.app-id = 'com.noodlesoft.Hazel'
run = ['move-node-to-workspace 7-Files']

# Finder and Preview are best left floating (they pop up contextually)
[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.apple.preview'
run = ['layout floating']


# ── Workspace 8 · Bibliography ───────────────────────────

[[on-window-detected]]
if.app-id = 'org.zotero.zotero'
run = ['move-node-to-workspace 8-Bib']

[[on-window-detected]]
if.app-id = 'net.kovidgoyal.calibre'
run = ['move-node-to-workspace 8-Bib']


# ── Workspace 9 · Share / Screen Sharing ─────────────────

[[on-window-detected]]
if.app-id = 'com.apple.ScreenSharing'
run = ['move-node-to-workspace 9-Share']


# ── Always Floating Windows ──────────────────────────────
# These apps are dialog/utility style and shouldn't be tiled

[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.kawauso.LadioCast'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.runningwithcrayons.Alfred'
run = ['layout floating']


# ════════════════════════════════════════════════════════════
# MONITOR ASSIGNMENTS
# Force specific workspaces to always open on a specific monitor
# 'main' = your primary display, 'secondary' = your second display
# ════════════════════════════════════════════════════════════

[workspace-to-monitor-force-assignment]
1-Browsing = 'secondary'
2-Media    = 'secondary'
3-Chats    = 'main'
4-Code     = 'secondary'
5-Writing  = 'secondary'
6-Mail     = 'main'
7-Files    = 'main'
8-Bib      = 'secondary'
9-Share    = 'secondary'
0-Misc     = 'secondary'
